<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Songs</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .song-item {
      margin-bottom: 10px;
      text-align: center;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
    }

    .song-item.is-playing {
      border-color: #4CAF50;
      background: #f7fff8;
    }

    .matchup-grid {
      display: grid;
      gap: 12px;
    }

    @media (min-width: 700px) {
      .matchup-grid {
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
      }

      .vs-label {
        padding-top: 80px;
      }
    }

    .vs-label {
      text-align: center;
      font-weight: bold;
      color: #777;
      align-self: center;
    }

    .button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      text-align: center;
      background-color: #4CAF50;
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      box-sizing: border-box;
    }

    .button:hover:not(:disabled) {
      background-color: #45a049;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .button-preview {
      background: #191414;
      margin-top: 8px;
    }

    .button-preview:hover:not(:disabled) {
      background: #333;
    }

    .button-preview.is-active {
      background: #1Db954;
      color: #000;
    }

    .preview-controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .preview-controls .button {
      margin-top: 0;
    }

    .preview-controls .button-preview {
      flex: 1;
    }

    .button-skip {
      width: auto;
      min-width: 64px;
      padding: 10px 12px;
      background: #fff;
      color: #333;
      border: 1px solid #bbb;
    }

    .button-skip:hover:not(:disabled) {
      background: #f0f0f0;
    }

    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #f44336;
      padding: 10px 20px;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      font: inherit;
    }

    .back-button:hover {
      background-color: #e53935;
    }

    .undo-button {
      background-color: #f0ad4e;
    }

    .undo-button:hover:not(:disabled) {
      background-color: #ec971f;
    }

    .status {
      text-align: center;
    }

    .error {
      color: #c62828;
    }

    .round-label {
      text-align: center;
      margin-bottom: 16px;
      color: #555;
    }

    .hint {
      color: #555;
      font-size: 0.95em;
      text-align: center;
      margin: 0 0 16px;
    }

    .champion {
      text-align: center;
      margin: 0 0 20px;
      padding: 12px;
      border: 1px solid #c8e6c9;
      border-radius: 6px;
      background: #f1f8f2;
    }

    .ranking-list,
    .history-list {
      text-align: left;
      padding-left: 1.25rem;
    }

    .ranking-list li,
    .history-list li {
      margin-bottom: 8px;
    }

    .meta {
      color: #555;
      font-size: 0.9em;
    }

    .embed-host {
      margin-top: 8px;
      min-height: 80px;
    }

    .panel {
      margin-top: 20px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
      text-align: left;
    }

    .panel summary {
      cursor: pointer;
      font-weight: bold;
    }

    .panel-empty {
      color: #777;
      margin: 8px 0 0;
    }

    .elo-up {
      color: #2e7d32;
    }

    .elo-down {
      color: #c62828;
    }

    .preview-note {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #f7f7f7;
      text-align: left;
      font-size: 0.95em;
    }

    .preview-note.warning {
      border-color: #f0c36d;
      background: #fff8e8;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <button class="back-button" type="button" onclick="goBack()">Back</button>
  <div class="container">
    <div id="user-bar"></div>
    <h1>Tournament Rating</h1>
    <div id="round-label" class="round-label"></div>
    <div id="preview-mode-note" class="preview-note" hidden></div>
    <div id="song-container" class="status">Loading songs…</div>

    <div id="matchup-panel" hidden>
      <div class="matchup-grid">
        <div class="song-item" id="song-slot-0">
          <h3 id="song-name-0"></h3>
          <p id="song-artist-0"></p>
          <p class="meta" id="song-meta-0"></p>
          <div class="embed-host" data-embed-host="0"><div id="embed-0"></div></div>
          <div class="preview-controls">
            <button type="button" class="button button-preview" id="preview-btn-0">Play preview</button>
            <button type="button" class="button button-skip" id="skip-btn-0" hidden>+5s</button>
          </div>
          <button type="button" class="button" id="select-btn-0">Select</button>
        </div>
        <div class="vs-label">vs</div>
        <div class="song-item" id="song-slot-1">
          <h3 id="song-name-1"></h3>
          <p id="song-artist-1"></p>
          <p class="meta" id="song-meta-1"></p>
          <div class="embed-host" data-embed-host="1"><div id="embed-1"></div></div>
          <div class="preview-controls">
            <button type="button" class="button button-preview" id="preview-btn-1">Play preview</button>
            <button type="button" class="button button-skip" id="skip-btn-1" hidden>+5s</button>
          </div>
          <button type="button" class="button" id="select-btn-1">Select</button>
        </div>
      </div>
    </div>

    <button class="button undo-button" type="button" id="undo-button" onclick="undoSelection()" disabled>Undo last match</button>
    <div id="side-panels"></div>
  </div>

  <script src="spotify-auth.js"></script>
  <script src="spotify-player.js"></script>
  <script>
    const ELO_START = 1000;
    const ELO_K = 32;

    let originalSongs = [];
    let remaining = [];
    let advancing = [];
    let currentPair = [];
    let history = [];
    let matchLog = [];
    let eliminated = [];
    let roundNumber = 1;
    let finished = false;
    let spotifyProfile = null;
    let previewMode = 'embed'; // 'account' | 'embed'
    let heats = [];
    let currentHeatIndex = 0;
    let heatChampions = [];
    let phase = 'heat'; // 'heat' | 'final'
    let dualHeatEnabled = false;
    let sampleSizeSetting = 'all';

    let spotifyIframeApi = null;
    let embedControllers = [null, null];
    let embedsInitialized = false;
    let previewPlaying = [false, false];
    let htmlAudio = null;
    let htmlAudioIndex = null;

    const songContainer = document.getElementById('song-container');
    const matchupPanel = document.getElementById('matchup-panel');
    const undoButton = document.getElementById('undo-button');
    const roundLabel = document.getElementById('round-label');
    const userBar = document.getElementById('user-bar');
    const sidePanels = document.getElementById('side-panels');
    const previewModeNote = document.getElementById('preview-mode-note');

    ensureUserBarStyles();

    document.getElementById('select-btn-0').addEventListener('click', () => selectWinner(0));
    document.getElementById('select-btn-1').addEventListener('click', () => selectWinner(1));
    document.getElementById('preview-btn-0').addEventListener('click', () => togglePreview(0));
    document.getElementById('preview-btn-1').addEventListener('click', () => togglePreview(1));
    document.getElementById('skip-btn-0').addEventListener('click', () => skipPreview(0));
    document.getElementById('skip-btn-1').addEventListener('click', () => skipPreview(1));

    let embedPositionsSec = [0, 0];

    function shuffle(songs) {
      const copy = [...songs];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function createSong(track) {
      return {
        name: track.name,
        artist: track.artists.map((artist) => artist.name).join(', '),
        id: track.id,
        previewUrl: track.preview_url || null,
        durationMs: track.duration_ms || 0,
        wins: 0,
        losses: 0,
        elo: ELO_START,
      };
    }

    function cloneSongs(songs) {
      return songs.map((song) => ({ ...song }));
    }

    function expectedScore(ratingA, ratingB) {
      return 1 / (1 + (10 ** ((ratingB - ratingA) / 400)));
    }

    function applyElo(winner, loser) {
      const winnerExpected = expectedScore(winner.elo, loser.elo);
      const loserExpected = expectedScore(loser.elo, winner.elo);
      const winnerDelta = Math.round(ELO_K * (1 - winnerExpected));
      const loserDelta = Math.round(ELO_K * (0 - loserExpected));
      winner.elo += winnerDelta;
      loser.elo += loserDelta;
      return { winnerDelta, loserDelta };
    }

    function formatEloDelta(delta) {
      if (delta > 0) {
        return `<span class="elo-up">+${delta}</span>`;
      }
      if (delta < 0) {
        return `<span class="elo-down">${delta}</span>`;
      }
      return '<span>0</span>';
    }

    function getActiveSongs() {
      return Array.from(
        new Map(
          [...remaining, ...advancing, ...currentPair, ...eliminated]
            .map((song) => [song.id, song])
        ).values()
      );
    }

    function getRankings() {
      return getActiveSongs().sort((a, b) => (
        b.elo - a.elo
        || b.wins - a.wins
        || a.losses - b.losses
        || a.name.localeCompare(b.name)
      ));
    }

    function updateRoundLabel() {
      const stillIn = remaining.length + advancing.length + currentPair.length;
      if (stillIn <= 0) {
        roundLabel.textContent = '';
        return;
      }

      let stage = 'Bracket';
      if (phase === 'final') {
        stage = 'Final';
      } else if (heats.length > 1) {
        stage = `Heat ${currentHeatIndex + 1} of ${heats.length}`;
      } else if (sampleSizeSetting !== 'all') {
        stage = `Sample of ${heats[0]?.length || stillIn}`;
      }

      roundLabel.textContent =
        `${stage} · Round ${roundNumber} · ${stillIn} song${stillIn === 1 ? '' : 's'} left · ${matchLog.length} match${matchLog.length === 1 ? '' : 'es'} played`;
    }

    function ensureHtmlAudio() {
      if (htmlAudio) {
        return htmlAudio;
      }

      htmlAudio = new Audio();
      htmlAudio.preload = 'none';
      htmlAudio.addEventListener('ended', () => {
        if (htmlAudioIndex !== null) {
          previewPlaying[htmlAudioIndex] = false;
          updatePreviewButtons();
          htmlAudioIndex = null;
        }
      });
      htmlAudio.addEventListener('pause', () => {
        if (htmlAudioIndex !== null && htmlAudio.paused) {
          previewPlaying[htmlAudioIndex] = false;
          updatePreviewButtons();
        }
      });
      return htmlAudio;
    }

    function loadSpotifyIframeApi() {
      if (spotifyIframeApi) {
        return Promise.resolve(spotifyIframeApi);
      }

      return new Promise((resolve, reject) => {
        const timeout = setTimeout(() => {
          reject(new Error('Timed out loading Spotify preview player'));
        }, 15000);

        const previous = window.onSpotifyIframeApiReady;
        window.onSpotifyIframeApiReady = (api) => {
          clearTimeout(timeout);
          spotifyIframeApi = api;
          if (typeof previous === 'function') {
            previous(api);
          }
          resolve(api);
        };

        if (!document.getElementById('spotify-iframe-api')) {
          const script = document.createElement('script');
          script.id = 'spotify-iframe-api';
          script.src = 'https://open.spotify.com/embed/iframe-api/v1';
          script.async = true;
          script.onerror = () => {
            clearTimeout(timeout);
            reject(new Error('Could not load Spotify preview player'));
          };
          document.body.appendChild(script);
        }
      });
    }

    function loadTrackIntoController(controller, trackId) {
      const uri = `spotify:track:${trackId}`;
      if (typeof controller.loadUri === 'function') {
        return controller.loadUri(uri);
      }
      if (typeof controller.loadEntity === 'function') {
        return controller.loadEntity(uri);
      }
      return null;
    }

    async function ensureEmbedControllers() {
      if (embedsInitialized) {
        return embedControllers;
      }

      const api = await loadSpotifyIframeApi();

      await Promise.all([0, 1].map((index) => new Promise((resolve) => {
        const element = document.getElementById(`embed-${index}`);
        api.createController(element, {
          width: '100%',
          height: '80',
          uri: 'spotify:track:11dFghVXANMlKmJXsNCbNl',
        }, (controller) => {
          embedControllers[index] = controller;
          controller.addListener('playback_update', (event) => {
            const isPaused = Boolean(event?.data?.isPaused);
            const position = Number(event?.data?.position);
            if (Number.isFinite(position)) {
              // Embed API reports position in milliseconds.
              embedPositionsSec[index] = position / 1000;
            }
            previewPlaying[index] = !isPaused;
            if (!isPaused) {
              pausePreviewSide(1 - index);
            }
            updatePreviewButtons();
          });
          resolve();
        });
      })));

      embedsInitialized = true;
      return embedControllers;
    }

    function pauseHtmlAudio() {
      if (htmlAudio && !htmlAudio.paused) {
        htmlAudio.pause();
      }
      if (htmlAudioIndex !== null) {
        previewPlaying[htmlAudioIndex] = false;
        htmlAudioIndex = null;
      }
    }

    function pausePreviewSide(index) {
      const controller = embedControllers[index];
      if (controller) {
        try {
          controller.pause();
        } catch (error) {
          console.warn('Could not pause preview', error);
        }
      }
      if (htmlAudioIndex === index) {
        pauseHtmlAudio();
      }
      previewPlaying[index] = false;
    }

    function stopAllPreviews() {
      pausePreviewSide(0);
      pausePreviewSide(1);
      pauseHtmlAudio();
      pauseAccountPlayback();
      previewPlaying = [false, false];
      updatePreviewButtons();
    }

    function updatePreviewButtons() {
      [0, 1].forEach((index) => {
        const button = document.getElementById(`preview-btn-${index}`);
        const skipButton = document.getElementById(`skip-btn-${index}`);
        const slot = document.getElementById(`song-slot-${index}`);
        if (!button || !slot) {
          return;
        }

        const playing = previewPlaying[index];
        button.textContent = playing ? 'Pause preview' : 'Play preview';
        button.classList.toggle('is-active', playing);
        slot.classList.toggle('is-playing', playing);
        if (skipButton) {
          skipButton.hidden = !playing;
        }
      });
    }

    async function skipPreview(index) {
      if (!previewPlaying[index]) {
        return;
      }

      if (previewMode === 'account') {
        await skipAccountPlayback(5);
        return;
      }

      if (htmlAudioIndex === index && htmlAudio) {
        htmlAudio.currentTime += 5;
        return;
      }

      const controller = embedControllers[index];
      if (controller && typeof controller.seek === 'function') {
        const nextSec = (embedPositionsSec[index] || 0) + 5;
        embedPositionsSec[index] = nextSec;
        controller.seek(nextSec);
      }
    }

    function applyPreviewModeUi() {
      const usingAccount = previewMode === 'account';
      document.querySelectorAll('[data-embed-host]').forEach((host) => {
        host.hidden = usingAccount;
      });

      // Only show a note when the user needs to take action.
      if (spotifyProfile && isPremiumProfile(spotifyProfile) && !hasAccountPlaybackScopes()) {
        previewModeNote.hidden = false;
        previewModeNote.classList.add('warning');
        previewModeNote.innerHTML =
          'Premium account playback needs a fresh login. ' +
          '<button type="button" class="button button-secondary" id="reauth-playback-button" style="width:auto;display:inline-block;margin:8px 0 0;">Re-authorize</button>';
        document.getElementById('reauth-playback-button')?.addEventListener('click', () => {
          logout({ switchAccount: true });
        });
        return;
      }

      previewModeNote.hidden = true;
      previewModeNote.textContent = '';
    }

    async function configurePreviewMode(profile) {
      spotifyProfile = profile;
      previewMode = 'embed';

      if (!isPremiumProfile(profile) || !hasAccountPlaybackScopes()) {
        applyPreviewModeUi();
        return;
      }

      try {
        await ensureWebPlayer();
        previewMode = 'account';
      } catch (error) {
        console.warn('Falling back to embed previews:', error);
        previewMode = 'embed';
      }

      applyPreviewModeUi();
    }

    function buildHeats(allSongs, sampleSize, wantDual) {
      const pool = shuffle([...allSongs]);
      if (sampleSize === 'all') {
        return { heats: [pool], dual: false };
      }

      const size = Number(sampleSize);
      if (!size || size >= pool.length) {
        return { heats: [pool], dual: false };
      }

      const heat1 = pool.slice(0, size);
      if (!wantDual) {
        return { heats: [heat1], dual: false };
      }

      const rest = pool.slice(size);
      if (rest.length < 2) {
        return { heats: [heat1], dual: false };
      }

      return { heats: [heat1, rest.slice(0, size)], dual: true };
    }

    function startHeat(index) {
      phase = 'heat';
      currentHeatIndex = index;
      remaining = [...heats[index]];
      advancing = [];
      currentPair = [];
      history = [];
      roundNumber = 1;
      finished = false;
      undoButton.hidden = false;
      nextMatch();
    }

    function beginFinal() {
      phase = 'final';
      remaining = [...heatChampions];
      advancing = [];
      currentPair = [];
      history = [];
      roundNumber = 1;
      finished = false;
      undoButton.hidden = false;
      nextMatch();
    }

    function showHeatTransition(champion, nextIndex) {
      stopAllPreviews();
      matchupPanel.hidden = true;
      songContainer.hidden = false;
      undoButton.hidden = true;
      roundLabel.textContent = `Heat ${currentHeatIndex + 1} complete`;
      songContainer.innerHTML = `
        <div class="champion">
          <strong>Heat ${currentHeatIndex + 1} champion:</strong> ${escapeHtml(champion.name)}
          <div class="meta">${escapeHtml(champion.artist)} · Elo ${champion.elo}</div>
        </div>
        <p class="hint">Next up: Heat ${nextIndex + 1} with ${heats[nextIndex].length} different songs.</p>
        <button class="button" type="button" id="continue-heat-button">Start Heat ${nextIndex + 1}</button>
      `;
      document.getElementById('continue-heat-button').addEventListener('click', () => {
        startHeat(nextIndex);
      });
      renderSidePanels({ openHistory: true, openRankings: true });
    }

    function showFinalTransition() {
      stopAllPreviews();
      matchupPanel.hidden = true;
      songContainer.hidden = false;
      undoButton.hidden = true;
      roundLabel.textContent = 'Heats complete';
      songContainer.innerHTML = `
        <div class="champion">
          <p><strong>Heat 1 champion:</strong> ${escapeHtml(heatChampions[0].name)}</p>
          <p><strong>Heat 2 champion:</strong> ${escapeHtml(heatChampions[1].name)}</p>
        </div>
        <p class="hint">Pit the two heat winners against each other.</p>
        <button class="button" type="button" id="continue-final-button">Start Final</button>
      `;
      document.getElementById('continue-final-button').addEventListener('click', () => {
        beginFinal();
      });
      renderSidePanels({ openHistory: true, openRankings: true });
    }

    function onBracketComplete(champion) {
      if (phase === 'final') {
        displayWinner(champion);
        return;
      }

      heatChampions.push(champion);

      if (currentHeatIndex < heats.length - 1) {
        showHeatTransition(champion, currentHeatIndex + 1);
        return;
      }

      if (dualHeatEnabled && heatChampions.length >= 2) {
        showFinalTransition();
        return;
      }

      displayWinner(champion);
    }

    function setupTournamentFromPlaylist(allSongs) {
      sampleSizeSetting = localStorage.getItem(STORAGE_KEYS.sampleSize) || 'all';
      const wantDual = localStorage.getItem(STORAGE_KEYS.dualHeat) === 'true';
      const built = buildHeats(allSongs, sampleSizeSetting, wantDual);
      heats = built.heats;
      dualHeatEnabled = built.dual;
      heatChampions = [];
      currentHeatIndex = 0;
      phase = 'heat';
      history = [];
      matchLog = [];
      eliminated = [];
      startHeat(0);
    }

    async function syncEmbedsToCurrentPair() {
      if (previewMode === 'account' || currentPair.length !== 2) {
        return;
      }

      try {
        await ensureEmbedControllers();
        currentPair.forEach((song, index) => {
          const controller = embedControllers[index];
          if (controller) {
            loadTrackIntoController(controller, song.id);
          }
        });
      } catch (error) {
        console.warn(error);
      }
    }

    async function togglePreview(index) {
      const song = currentPair[index];
      if (!song) {
        return;
      }

      if (previewPlaying[index]) {
        if (previewMode === 'account') {
          await pauseAccountPlayback();
        } else {
          pausePreviewSide(index);
          pauseHtmlAudio();
        }
        previewPlaying[index] = false;
        updatePreviewButtons();
        return;
      }

      pausePreviewSide(1 - index);
      pauseHtmlAudio();
      if (previewMode === 'account') {
        await pauseAccountPlayback();
      }

      if (previewMode === 'account') {
        try {
          await playAccountTrackPreview(song.id, {
            positionMs: getPreviewStartMs(song),
            onStopped: () => {
              previewPlaying = [false, false];
              updatePreviewButtons();
            },
          });
          previewPlaying = [false, false];
          previewPlaying[index] = true;
          updatePreviewButtons();
          return;
        } catch (error) {
          console.warn('Account preview failed, falling back to embed', error);
          previewMode = 'embed';
          applyPreviewModeUi();
        }
      }

      const startSec = getPreviewStartMs(song) / 1000;

      if (song.previewUrl) {
        const audio = ensureHtmlAudio();
        htmlAudioIndex = index;
        audio.src = song.previewUrl;
        try {
          const maxStart = Math.max(0, (Number(song.durationMs) / 1000) - 5);
          audio.currentTime = Math.min(startSec, maxStart);
          await audio.play();
          previewPlaying[index] = true;
          updatePreviewButtons();
          return;
        } catch (error) {
          console.warn('HTML preview failed, falling back to Spotify embed', error);
        }
      }

      try {
        await ensureEmbedControllers();
        const controller = embedControllers[index];
        if (!controller) {
          return;
        }
        loadTrackIntoController(controller, song.id);
        if (typeof controller.play === 'function') {
          controller.play();
        } else if (typeof controller.togglePlay === 'function') {
          controller.togglePlay();
        } else if (typeof controller.resume === 'function') {
          controller.resume();
        }
        if (typeof controller.seek === 'function' && startSec > 0) {
          setTimeout(() => {
            try {
              controller.seek(startSec);
              embedPositionsSec[index] = startSec;
            } catch (error) {
              console.warn('Could not seek embed preview', error);
            }
          }, 400);
        }
        previewPlaying[index] = true;
        updatePreviewButtons();
      } catch (error) {
        console.error(error);
        alert('Could not start the Spotify preview. Try again or use the embed controls.');
      }
    }

    function renderSidePanels(options = {}) {
      const { showRankings = true, openHistory = matchLog.length > 0, openRankings = false } = options;
      const rankings = getRankings();

      const historyItems = matchLog.length === 0
        ? '<p class="panel-empty">No matches yet.</p>'
        : `<ol class="history-list" reversed>${matchLog.slice().reverse().map((match, index) => {
            const matchNumber = matchLog.length - index;
            return `
              <li>
                <strong>Match ${matchNumber} · Round ${match.round}</strong><br>
                ${escapeHtml(match.winnerName)} beat ${escapeHtml(match.loserName)}
                <div class="meta">
                  ${escapeHtml(match.winnerName)} ${formatEloDelta(match.winnerDelta)}
                  · ${escapeHtml(match.loserName)} ${formatEloDelta(match.loserDelta)}
                </div>
              </li>
            `;
          }).join('')}</ol>`;

      const rankingItems = rankings.length === 0
        ? '<p class="panel-empty">No ratings yet.</p>'
        : `<ol class="ranking-list">${rankings.map((song) => `
            <li>
              ${escapeHtml(song.name)}
              <div class="meta">
                ${escapeHtml(song.artist)} · Elo ${song.elo} · ${song.wins}-${song.losses}
              </div>
            </li>
          `).join('')}</ol>`;

      sidePanels.innerHTML = `
        <details class="panel" ${openHistory ? 'open' : ''}>
          <summary>Match history (${matchLog.length})</summary>
          ${historyItems}
        </details>
        ${showRankings ? `
          <details class="panel" ${openRankings ? 'open' : ''}>
            <summary>${finished ? 'Elo rankings' : 'Live Elo rankings'}</summary>
            <p class="hint">Ratings move after every pick, so a tough early loss can still finish high.</p>
            ${rankingItems}
          </details>
        ` : ''}
      `;
    }

    function showStatus(messageHtml) {
      stopAllPreviews();
      matchupPanel.hidden = true;
      songContainer.hidden = false;
      songContainer.innerHTML = messageHtml;
    }

    function renderMatchup() {
      finished = false;
      stopAllPreviews();
      updateRoundLabel();

      songContainer.hidden = true;
      songContainer.innerHTML = '';
      matchupPanel.hidden = false;

      currentPair.forEach((song, index) => {
        document.getElementById(`song-name-${index}`).textContent = song.name;
        document.getElementById(`song-artist-${index}`).textContent = song.artist;
        document.getElementById(`song-meta-${index}`).textContent =
          `Elo ${song.elo} · ${song.wins}-${song.losses}`;
      });

      undoButton.disabled = history.length === 0;
      undoButton.hidden = false;
      updatePreviewButtons();
      renderSidePanels({ openHistory: true, openRankings: false });
      syncEmbedsToCurrentPair();
    }

    function nextMatch() {
      while (remaining.length < 2) {
        if (remaining.length === 1) {
          advancing.push(remaining.shift());
        }

        if (remaining.length === 0) {
          if (advancing.length === 1) {
            onBracketComplete(advancing[0]);
            return;
          }

          if (advancing.length === 0) {
            showStatus('<p class="error">No songs available for this tournament.</p>');
            undoButton.disabled = true;
            sidePanels.innerHTML = '';
            return;
          }

          remaining = advancing;
          advancing = [];
          roundNumber += 1;
        }
      }

      currentPair = [remaining.shift(), remaining.shift()];
      renderMatchup();
    }

    function selectWinner(index) {
      stopAllPreviews();

      const winner = currentPair[index];
      const loser = currentPair[1 - index];
      const winnerWinsBefore = winner.wins;
      const winnerLossesBefore = winner.losses;
      const loserWinsBefore = loser.wins;
      const loserLossesBefore = loser.losses;
      const winnerEloBefore = winner.elo;
      const loserEloBefore = loser.elo;

      const { winnerDelta, loserDelta } = applyElo(winner, loser);
      winner.wins += 1;
      loser.losses += 1;

      const matchRecord = {
        round: roundNumber,
        winnerId: winner.id,
        loserId: loser.id,
        winnerName: winner.name,
        loserName: loser.name,
        winnerDelta,
        loserDelta,
      };

      history.push({
        pair: [...currentPair],
        remaining: [...remaining],
        advancing: [...advancing],
        eliminated: [...eliminated],
        roundNumber,
        winner,
        loser,
        winnerWinsBefore,
        winnerLossesBefore,
        loserWinsBefore,
        loserLossesBefore,
        winnerEloBefore,
        loserEloBefore,
      });

      matchLog.push(matchRecord);
      eliminated.push(loser);
      advancing.push(winner);
      currentPair = [];
      nextMatch();
    }

    function undoSelection() {
      const previous = history.pop();
      if (!previous) {
        return;
      }

      stopAllPreviews();

      previous.winner.wins = previous.winnerWinsBefore;
      previous.winner.losses = previous.winnerLossesBefore;
      previous.loser.wins = previous.loserWinsBefore;
      previous.loser.losses = previous.loserLossesBefore;
      previous.winner.elo = previous.winnerEloBefore;
      previous.loser.elo = previous.loserEloBefore;

      matchLog.pop();
      remaining = previous.remaining;
      advancing = previous.advancing;
      eliminated = previous.eliminated;
      roundNumber = previous.roundNumber;
      currentPair = previous.pair;
      finished = false;
      renderMatchup();
    }

    function displayWinner(champion) {
      finished = true;
      stopAllPreviews();
      matchupPanel.hidden = true;
      songContainer.hidden = false;
      roundLabel.textContent = 'Tournament complete';
      undoButton.disabled = history.length === 0;
      undoButton.hidden = false;

      const rankings = getRankings();
      const ratingLeader = rankings[0];
      const championIsLeader = ratingLeader && ratingLeader.id === champion.id;

      songContainer.innerHTML = `
        <div class="champion">
          <strong>Bracket champion:</strong> ${escapeHtml(champion.name)}
          <div class="meta">${escapeHtml(champion.artist)} · ${champion.wins}-${champion.losses} · Elo ${champion.elo}</div>
        </div>
        <h2>Final Elo Rankings</h2>
        <p class="hint">
          Sorted by Elo from your head-to-head picks
          ${championIsLeader ? '' : `, not only by who won the bracket`}.
        </p>
        <ol class="ranking-list">
          ${rankings.map((song, index) => `
            <li>
              <strong>${index + 1}. ${escapeHtml(song.name)}</strong>
              ${song.id === champion.id ? ' <span class="meta">(bracket champion)</span>' : ''}
              <div class="meta">
                ${escapeHtml(song.artist)} · Elo ${song.elo} · Record ${song.wins}-${song.losses}
              </div>
            </li>
          `).join('')}
        </ol>
        <button class="button" type="button" onclick="restartTournament()">Restart Tournament</button>
      `;

      renderSidePanels({ showRankings: false, openHistory: true });
    }

    function restartTournament() {
      stopAllPreviews();
      originalSongs = cloneSongs(originalSongs).map((song) => ({
        ...song,
        wins: 0,
        losses: 0,
        elo: ELO_START,
      }));
      setupTournamentFromPlaylist(originalSongs);
    }

    function goBack() {
      stopAllPreviews();
      localStorage.removeItem(STORAGE_KEYS.selectedPlaylistId);
      localStorage.removeItem(STORAGE_KEYS.sampleSize);
      localStorage.removeItem(STORAGE_KEYS.dualHeat);
      window.location.href = 'choose-playlist.html';
    }

    window.onload = async function () {
      const accessToken = await getValidAccessToken();
      const selectedPlaylistId = localStorage.getItem(STORAGE_KEYS.selectedPlaylistId);

      if (!accessToken) {
        showStatus('<p class="error">You are not authorized. <a href="index.html">Log in with Spotify</a>.</p>');
        return;
      }

      try {
        spotifyProfile = await renderUserBar(userBar);
        await configurePreviewMode(spotifyProfile);
      } catch (error) {
        showStatus(`
          <p class="error">${escapeHtml(error.message || 'Could not verify your Spotify profile.')}</p>
          <p class="error">Use Log out or Switch account above, then try again.</p>
        `);
        return;
      }

      if (!selectedPlaylistId) {
        showStatus('<p class="error">No playlist selected. <a href="choose-playlist.html">Choose a playlist</a>.</p>');
        return;
      }

      try {
        const items = await fetchAllPages(
          `https://api.spotify.com/v1/playlists/${selectedPlaylistId}/tracks?limit=100`
        );

        const songs = items
          .filter((item) => item.track && item.track.id)
          .map((item) => createSong(item.track));

        const uniqueSongs = Array.from(new Map(songs.map((song) => [song.id, song])).values());

        if (uniqueSongs.length === 0) {
          alert('This playlist is empty. Please select a different playlist.');
          goBack();
          return;
        }

        originalSongs = cloneSongs(uniqueSongs);

        // Warm preview backends in the background.
        if (previewMode === 'account') {
          ensureWebPlayer().catch((error) => console.warn(error));
        } else {
          loadSpotifyIframeApi().catch((error) => console.warn(error));
        }

        if (uniqueSongs.length === 1) {
          heats = [uniqueSongs];
          dualHeatEnabled = false;
          displayWinner(uniqueSongs[0]);
          return;
        }

        setupTournamentFromPlaylist(originalSongs);
      } catch (error) {
        console.error('Error fetching songs:', error);
        if (error.message === 'Not authorized') {
          clearAuth();
          showStatus('<p class="error">Your Spotify session expired. <a href="index.html">Log in again</a>.</p>');
          return;
        }

        showStatus(`
          <p class="error">Error fetching songs. Please check your connection or reauthorize the app.</p>
          <button class="button" type="button" onclick="window.location.reload()">Retry</button>
        `);
      }
    };
  </script>
</body>
</html>
