<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Playlist</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .playlist-item {
      margin-bottom: 10px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      text-align: center;
      background-color: #4CAF50;
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      box-sizing: border-box;
    }

    .button:hover:not(:disabled) {
      background-color: #45a049;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 12px;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="user-bar"></div>
    <h1>Choose a Playlist</h1>
    <div id="playlist-container" class="status">Loading playlists…</div>
    <button type="button" class="button" id="select-button" disabled>Select Playlist</button>
    <p id="error" class="status error" hidden></p>
  </div>

  <script src="spotify-auth.js"></script>
  <script>
    const playlistContainer = document.getElementById('playlist-container');
    const selectButton = document.getElementById('select-button');
    const errorEl = document.getElementById('error');
    const userBar = document.getElementById('user-bar');

    ensureUserBarStyles();

    function showError(message) {
      errorEl.hidden = false;
      errorEl.innerHTML = message;
    }

    async function fetchPlaylists() {
      localStorage.removeItem(STORAGE_KEYS.selectedPlaylistId);

      const accessToken = await getValidAccessToken();
      if (!accessToken) {
        playlistContainer.textContent = '';
        userBar.innerHTML = '';
        showError('You are not authorized. <a href="index.html">Log in with Spotify</a>.');
        return;
      }

      try {
        await renderUserBar(userBar);
      } catch (error) {
        playlistContainer.textContent = '';
        showError(
          `${escapeHtml(error.message || 'Could not verify your Spotify profile.')} ` +
          'Use <strong>Log out</strong> or <strong>Switch account</strong> above, then try again.'
        );
        return;
      }

      try {
        const playlists = await fetchAllPages('https://api.spotify.com/v1/me/playlists?limit=50');
        playlistContainer.innerHTML = '';
        errorEl.hidden = true;

        if (playlists.length === 0) {
          playlistContainer.textContent = 'No playlists found on this account.';
          return;
        }

        playlists.forEach((playlist) => {
          const playlistItem = document.createElement('div');
          const safeId = escapeHtml(playlist.id);
          const safeName = escapeHtml(playlist.name);
          playlistItem.classList.add('playlist-item');
          playlistItem.innerHTML = `
            <input type="radio" name="playlist" value="${safeId}" id="${safeId}">
            <label for="${safeId}">${safeName}</label>
          `;
          playlistContainer.appendChild(playlistItem);
        });

        document.querySelectorAll('input[name="playlist"]').forEach((radio) => {
          radio.addEventListener('change', () => {
            selectButton.disabled = false;
          });
        });
      } catch (error) {
        console.error('Error fetching playlists:', error);
        playlistContainer.textContent = '';
        if (error.message === 'Not authorized') {
          clearAuth();
          showError('Your Spotify session expired. <a href="index.html">Log in again</a>.');
        } else {
          showError(
            `Error fetching playlists: ${escapeHtml(error.message)}. ` +
            'Try <strong>Log out</strong> / <strong>Switch account</strong>, then authorize again.'
          );
        }
      }
    }

    selectButton.addEventListener('click', () => {
      const selected = document.querySelector('input[name="playlist"]:checked');
      if (!selected) {
        return;
      }

      localStorage.setItem(STORAGE_KEYS.selectedPlaylistId, selected.value);
      window.location.href = 'rate-songs.html';
    });

    fetchPlaylists();
  </script>
</body>
</html>
