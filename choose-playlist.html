<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Playlist</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .playlist-item {
      margin-bottom: 10px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      text-align: center;
      background-color: #4CAF50;
      color: #fff;
      text-decoration: none;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font: inherit;
      box-sizing: border-box;
    }

    .button:hover:not(:disabled) {
      background-color: #45a049;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      margin-top: 12px;
    }

    .error {
      color: #c62828;
    }

    .options-panel {
      margin-top: 24px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }

    .options-panel label {
      display: block;
      margin: 8px 0;
    }

    .hint {
      color: #555;
      font-size: 0.95em;
      margin: 10px 0 0;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="user-bar"></div>
    <h1>Choose a Playlist</h1>
    <div id="playlist-container" class="status">Loading playlists…</div>

    <div id="tournament-options" class="options-panel" hidden>
      <h2>Tournament size</h2>
      <label><input type="radio" name="sample-size" value="all" checked> All songs</label>
      <label><input type="radio" name="sample-size" value="16"> Random 16</label>
      <label><input type="radio" name="sample-size" value="32"> Random 32</label>
      <label><input type="radio" name="sample-size" value="64"> Random 64</label>

      <label id="dual-heat-wrap">
        <input type="checkbox" id="dual-heat" checked>
        Two heats + final
      </label>
      <p class="hint" id="options-hint">
        With two heats, a second non-overlapping sample runs after the first, then the two heat winners play each other.
      </p>
    </div>

    <button type="button" class="button" id="select-button" disabled>Start Tournament</button>
    <p id="error" class="status error" hidden></p>
  </div>

  <script src="spotify-auth.js"></script>
  <script>
    const playlistContainer = document.getElementById('playlist-container');
    const selectButton = document.getElementById('select-button');
    const errorEl = document.getElementById('error');
    const userBar = document.getElementById('user-bar');
    const tournamentOptions = document.getElementById('tournament-options');
    const dualHeat = document.getElementById('dual-heat');
    const dualHeatWrap = document.getElementById('dual-heat-wrap');
    const optionsHint = document.getElementById('options-hint');

    ensureUserBarStyles();

    function showError(message) {
      errorEl.hidden = false;
      errorEl.innerHTML = message;
    }

    function syncOptionsUi() {
      const sample = document.querySelector('input[name="sample-size"]:checked')?.value || 'all';
      const sampling = sample !== 'all';
      dualHeat.disabled = !sampling;
      if (!sampling) {
        dualHeat.checked = false;
      } else if (!dualHeat.dataset.touched) {
        dualHeat.checked = true;
      }
      dualHeatWrap.style.opacity = sampling ? '1' : '0.55';
      optionsHint.textContent = sampling
        ? 'With two heats, a second non-overlapping sample runs after the first, then the two heat winners play each other.'
        : 'Using the full playlist as one bracket.';
    }

    async function fetchPlaylists() {
      localStorage.removeItem(STORAGE_KEYS.selectedPlaylistId);

      const accessToken = await getValidAccessToken();
      if (!accessToken) {
        playlistContainer.textContent = '';
        userBar.innerHTML = '';
        showError('You are not authorized. <a href="index.html">Log in with Spotify</a>.');
        return;
      }

      try {
        await renderUserBar(userBar);
      } catch (error) {
        playlistContainer.textContent = '';
        showError(
          `${escapeHtml(error.message || 'Could not verify your Spotify profile.')} ` +
          'Use <strong>Log out</strong> or <strong>Switch account</strong> above, then try again.'
        );
        return;
      }

      try {
        const playlists = await fetchAllPages('https://api.spotify.com/v1/me/playlists?limit=50');
        playlistContainer.innerHTML = '';
        errorEl.hidden = true;

        if (playlists.length === 0) {
          playlistContainer.textContent = 'No playlists found on this account.';
          return;
        }

        playlists.forEach((playlist) => {
          const playlistItem = document.createElement('div');
          const safeId = escapeHtml(playlist.id);
          const safeName = escapeHtml(playlist.name);
          playlistItem.classList.add('playlist-item');
          playlistItem.innerHTML = `
            <input type="radio" name="playlist" value="${safeId}" id="${safeId}">
            <label for="${safeId}">${safeName}</label>
          `;
          playlistContainer.appendChild(playlistItem);
        });

        document.querySelectorAll('input[name="playlist"]').forEach((radio) => {
          radio.addEventListener('change', () => {
            selectButton.disabled = false;
            tournamentOptions.hidden = false;
            syncOptionsUi();
          });
        });

        document.querySelectorAll('input[name="sample-size"]').forEach((radio) => {
          radio.addEventListener('change', syncOptionsUi);
        });
        dualHeat.addEventListener('change', () => {
          dualHeat.dataset.touched = '1';
        });
        syncOptionsUi();
      } catch (error) {
        console.error('Error fetching playlists:', error);
        playlistContainer.textContent = '';
        if (error.message === 'Not authorized') {
          clearAuth();
          showError('Your Spotify session expired. <a href="index.html">Log in again</a>.');
        } else {
          showError(
            `Error fetching playlists: ${escapeHtml(error.message)}. ` +
            'Try <strong>Log out</strong> / <strong>Switch account</strong>, then authorize again.'
          );
        }
      }
    }

    selectButton.addEventListener('click', () => {
      const selected = document.querySelector('input[name="playlist"]:checked');
      if (!selected) {
        return;
      }

      const sampleSize = document.querySelector('input[name="sample-size"]:checked')?.value || 'all';
      localStorage.setItem(STORAGE_KEYS.selectedPlaylistId, selected.value);
      localStorage.setItem(STORAGE_KEYS.sampleSize, sampleSize);
      localStorage.setItem(
        STORAGE_KEYS.dualHeat,
        sampleSize !== 'all' && dualHeat.checked ? 'true' : 'false'
      );
      window.location.href = 'rate-songs.html';
    });

    fetchPlaylists();
  </script>
</body>
</html>
